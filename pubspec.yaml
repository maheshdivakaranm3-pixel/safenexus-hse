name: safenexus_hse
description: "AI-Powered HSE Safety & Observation App for UAE"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/safenexus_hse_header_mobile.png
    - assets/images/safenexus_hse_banner.png
    - assets/images/safenexus_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/safenexus_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/safenexus_logo.png"
