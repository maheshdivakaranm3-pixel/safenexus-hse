name: safenexus_hse
description: "AI-Powered HSE Safety & Observation App for UAE"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Local data storage
  shared_preferences: ^2.3.2

  # Pick images from device
  image_picker: ^1.1.2

  # Application documents directory
  path_provider: ^2.1.4

  # Share safety reports
  share_plus: ^10.0.2

  # HTTP client for SafeNexus HSE backend
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/safenexus_hse_banner.png
    - assets/images/safenexus_hse_logo.png
