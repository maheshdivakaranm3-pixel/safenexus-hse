name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get Dependencies & Build APK
        run: |
          # നിങ്ങളുടെ പ്രോജക്റ്റ് ഫയലുകൾ കിടക്കുന്ന ഫോൾഡർ ഏതാണെന്ന് നോക്കി താഴെയുള്ള 'safenexus-hse' എന്നതിന് പകരം ആ ഫോൾഡറിന്റെ പേര് നൽകുക
          cd safenexus-hse
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
