name: SafeNexus HSE - Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Analyze and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Check tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Create Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Flutter Clean
        run: flutter clean

      - name: Flutter Pub Get After Clean
        run: flutter pub get

      - name: Generate App Icons After Clean
        run: dart run flutter_launcher_icons

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: GitHub secret KEYSTORE_BASE64 is missing."
            exit 1
          }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks || {
            echo "ERROR: upload-keystore.jks was not created."
            exit 1
          }
          echo "Release keystore restored successfully."

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: GitHub secret KEYSTORE_PASSWORD is missing."
            exit 1
          }
          test -n "$KEY_ALIAS" || {
            echo "ERROR: GitHub secret KEY_ALIAS is missing."
            exit 1
          }
          test -n "$KEY_PASSWORD" || {
            echo "ERROR: GitHub secret KEY_PASSWORD is missing."
            exit 1
          }
          flutter build apk --release

      - name: Verify APK
        run: |
          echo "Checking generated APK..."
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK successfully generated."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeNexus-HSE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
