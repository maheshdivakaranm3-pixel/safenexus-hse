name: SafeNexus HSE - Signed APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      # 3. Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Flutter packages
      - name: Flutter Pub Get
        run: flutter pub get

      # 5. Create release keystore
      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/upload-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass android \
            -keypass android \
            -dname "CN=SafeNexus HSE, OU=Safety, O=SafeNexus, L=Kerala, ST=Kerala, C=IN"

      # 6. Create key.properties
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      # 7. Build signed APK
      - name: Build Signed Release APK
        run: flutter build apk --release

      # 8. Verify APK
      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

          echo "Checking APK signature..."
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner verify --verbose "$APK"

      # 9. Upload APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeNexus-HSE-Signed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
