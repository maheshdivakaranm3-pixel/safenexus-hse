name: SafeNexus HSE - Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Analyze and Build APK
    runs-on: ubuntu-latest

    env:
      FALLBACK_KEYSTORE_PASSWORD: SafeNexusCI2026
      FALLBACK_KEY_ALIAS: safenexus-ci
      FALLBACK_KEY_PASSWORD: SafeNexusCI2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Check tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Create Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Flutter Clean
        run: flutter clean

      - name: Flutter Pub Get After Clean
        run: flutter pub get

      - name: Generate App Icons After Clean
        run: dart run flutter_launcher_icons

      - name: Select signing mode
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Permanent GitHub release keystore found."
          else
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$FALLBACK_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$FALLBACK_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$FALLBACK_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEYSTORE_BASE64 is not configured."
            echo "A temporary CI-only keystore will be generated."
          fi

      - name: Restore permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            test -s android/app/upload-keystore.jks || {
              echo "ERROR: Decoded release keystore is empty."
              exit 1
            }
            echo "Permanent release keystore restored."
          fi

      - name: Create temporary CI release keystore
        run: |
          if [ "$HAS_RELEASE_KEYSTORE" = "false" ]; then
            keytool -genkeypair               -v               -keystore android/app/upload-keystore.jks               -storepass "$KEYSTORE_PASSWORD"               -keypass "$KEY_PASSWORD"               -alias "$KEY_ALIAS"               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=SafeNexus HSE, OU=HSE, O=SafeNexus, L=Abu Dhabi, ST=Abu Dhabi, C=AE"

            test -s android/app/upload-keystore.jks
            echo "Temporary CI release keystore created."
          fi

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          echo "Checking generated APK..."
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK successfully generated."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeNexus-HSE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
