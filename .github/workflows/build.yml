name: SafeNexus HSE - Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Analyze and Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      # 4. Show versions
      - name: Check Flutter and Dart versions
        run: |
          flutter --version
          dart --version
          java -version

      # 5. Create Android local.properties
      # This prevents the "android/local.properties not found" error.
      - name: Create Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      # 6. Get Flutter dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 7. Clean previous build files
      - name: Flutter Clean
        run: flutter clean

      # 8. Get dependencies again after clean
      - name: Flutter Pub Get After Clean
        run: flutter pub get

      # 9. Analyze Dart code
      - name: Analyze Project
        run: flutter analyze

      # 10. Build Release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 11. Verify APK
      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      # 12. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeNexus-HSE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
