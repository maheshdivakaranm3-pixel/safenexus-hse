name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get
        working-directory: ./safenexus-hse

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./safenexus-hse

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: safenexus-hse/build/app/outputs/flutter-apk/app-release.apk
