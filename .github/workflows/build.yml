name: SafeNexus HSE APK Build

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout Repository
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # Set up Java 17
      # =========================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      # =========================
      # Set up Flutter
      # =========================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # =========================
      # Check Flutter & Dart
      # =========================
      - name: Check Flutter Version
        run: |
          flutter --version
          dart --version

      # =========================
      # Check Project Structure
      # =========================
      - name: Check Project Structure
        run: |
          echo "===== Project Root ====="
          ls -la

          echo "===== Android Folder ====="
          if [ -d "android" ]; then
            ls -la android
          else
            echo "ERROR: android folder not found"
            exit 1
          fi

      # =========================
      # Flutter Clean
      # =========================
      - name: Flutter Clean
        run: flutter clean

      # =========================
      # Get Dependencies
      # =========================
      - name: Get Dependencies
        run: flutter pub get

      # =========================
      # Analyze Flutter Project
      # =========================
      - name: Analyze Flutter Project
        run: flutter analyze

      # =========================
      # Build Release APK
      # =========================
      - name: Build Release APK
        run: flutter build apk --release

      # =========================
      # Verify APK
      # =========================
      - name: Verify APK
        run: |
          echo "===== APK Output ====="
          ls -lh build/app/outputs/flutter-apk/
          
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "ERROR: Release APK was not created"
            exit 1
          fi

      # =========================
      # Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeNexus-HSE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
