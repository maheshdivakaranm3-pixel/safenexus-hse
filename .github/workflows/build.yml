name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Move pubspec to root or organize files
        run: |
          # safenexus-hse ഉള്ളിലെ lib ഫോൾഡറിനെ പുറത്തേക്ക് കൊണ്ടുവരാൻ അല്ലെങ്കിൽ 
          # pubspec.yaml-നെ safenexus-hse ഉള്ളിലേക്ക് ഇടാൻ ശ്രദ്ധിക്കുക.
          # ഏറ്റവും എളുപ്പമുള്ള വഴി താഴെ കൊടുത്തിരിക്കുന്നു:
          mkdir -p safenexus-hse
          mv lib safenexus-hse/
          mv pubspec.yaml safenexus-hse/

      - name: Get Dependencies & Build APK
        run: |
          cd safenexus-hse
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: safenexus-hse/build/app/outputs/flutter-apk/app-release.apk
