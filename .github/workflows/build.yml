name: Build SafeNexus HSE APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Show Flutter Version
        run: flutter --version

      - name: Create Android Platform Support
        run: |
          flutter create . \
            --project-name=safenexus_hse \
            --platforms=android \
            --org=com.safenexus.hse

      - name: Update Android SDK Configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for file in files:
              if not file.exists():
                  continue

              text = file.read_text()

              # Groovy
              text = text.replace(
                  "compileSdk flutter.compileSdkVersion",
                  "compileSdk 36"
              )

              text = text.replace(
                  "targetSdk flutter.targetSdkVersion",
                  "targetSdk 36"
              )

              # Kotlin DSL
              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )

              text = text.replace(
                  "targetSdk = flutter.targetSdkVersion",
                  "targetSdk = 36"
              )

              file.write_text(text)
          PY

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeNexus-HSE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
