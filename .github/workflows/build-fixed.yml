name: SafeNexus HSE - Analyze and Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Flutter Analyze + Release APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==================================================
      # 3. FLUTTER 3.47.2
      # ==================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true


      # ==================================================
      # 4. TOOL VERSIONS
      # ==================================================
      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version


      # ==================================================
      # 5. ANDROID LOCAL PROPERTIES
      # ==================================================
      - name: Create Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties


      # ==================================================
      # 6. FLUTTER PUB GET
      # ==================================================
      - name: Flutter Pub Get
        run: flutter pub get


      # ==================================================
      # 7. FLUTTER CLEAN
      # ==================================================
      - name: Flutter Clean
        run: flutter clean


      # ==================================================
      # 8. PUB GET AFTER CLEAN
      # ==================================================
      - name: Flutter Pub Get After Clean
        run: flutter pub get


      # ==================================================
      # 9. CHECK ALL FOUR SIGNING SECRETS
      # ==================================================
      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          echo "Checking release signing secrets..."

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          }

          echo "All four release signing secrets are present."


      # ==================================================
      # 10. RESTORE PERMANENT KEYSTORE
      # ==================================================
      - name: Restore permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        run: |
          echo "Restoring permanent release keystore..."

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks || {
            echo "ERROR: Release keystore file was not created."
            exit 1
          }

          echo "Permanent release keystore restored successfully."


      # ==================================================
      # 11. VALIDATE KEYSTORE PASSWORD
      # ==================================================
      - name: Validate keystore password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

        run: |
          echo "Checking keystore password..."

          if keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/keystore-list.txt 2> /tmp/keystore-error.txt
          then
            echo "OK: Keystore password is correct."
          else
            echo "ERROR: KEYSTORE_PASSWORD does not unlock this keystore."
            echo "The KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets do not match."
            echo "Keytool error:"
            cat /tmp/keystore-error.txt
            exit 1
          fi


      # ==================================================
      # 12. VALIDATE KEY ALIAS
      # ==================================================
      - name: Validate keystore alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          echo "Checking keystore alias..."

          if keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /tmp/alias-check.txt 2> /tmp/alias-error.txt
          then
            echo "OK: KEY_ALIAS is correct."
          else
            echo "ERROR: KEY_ALIAS does not exist in this keystore."
            echo "Expected alias: $KEY_ALIAS"
            echo "Available keystore information:"
            cat /tmp/keystore-list.txt
            echo "Alias error:"
            cat /tmp/alias-error.txt
            exit 1
          fi


      # ==================================================
      # 13. VALIDATE PRIVATE KEY PASSWORD
      # ==================================================
      - name: Validate private key password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          echo "Checking private key password..."

          rm -f /tmp/key-validation.jks

          if keytool -importkeystore \
            -srckeystore android/app/upload-keystore.jks \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore /tmp/key-validation.jks \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -destalias "$KEY_ALIAS" \
            -noprompt
          then
            echo "OK: Private key password is correct."
          else
            echo "ERROR: KEY_PASSWORD does not match the private key."
            exit 1
          fi


      # ==================================================
      # 14. FLUTTER ANALYZE
      # ==================================================
      - name: Flutter Analyze
        run: flutter analyze


      # ==================================================
      # 15. BUILD RELEASE APK
      # ==================================================
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          flutter build apk --release


      # ==================================================
      # 16. VERIFY APK
      # ==================================================
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh build/app/outputs/flutter-apk/app-release.apk

          echo "SafeNexus HSE release APK generated successfully."


      # ==================================================
      # 17. UPLOAD APK ARTIFACT
      # ==================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4

        with:
          name: SafeNexus-HSE-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
