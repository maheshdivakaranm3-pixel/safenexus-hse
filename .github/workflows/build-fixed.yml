name: SafeNexus HSE - Analyze and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Flutter Analyze + Release APK
    runs-on: ubuntu-latest

    env:
      FALLBACK_KEYSTORE_PASSWORD: SafeNexusCI2026
      FALLBACK_KEY_ALIAS: safenexus-ci
      FALLBACK_KEY_PASSWORD: SafeNexusCI2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Create Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Clean
        run: flutter clean

      - name: Flutter Pub Get After Clean
        run: flutter pub get

      - name: Check release signing secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
            {
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Configured release signing secret found."
          else
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$FALLBACK_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$FALLBACK_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$FALLBACK_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEYSTORE_BASE64 is not configured. Temporary CI signing will be used."
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            test -s android/app/upload-keystore.jks || {
              echo "ERROR: The decoded release keystore is empty."
              exit 1
            }
            echo "Release keystore restored from GitHub Secret."
          else
            echo "Skipping permanent keystore restore."
          fi

      - name: Create temporary CI release keystore
        run: |
          if [ "$HAS_RELEASE_KEYSTORE" = "false" ]; then
            echo "Creating temporary CI-only release keystore."
            echo "This keystore is NOT suitable for publishing or future app updates."
            keytool -genkeypair \
              -v \
              -keystore android/app/upload-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SafeNexus HSE, OU=HSE, O=SafeNexus, L=Abu Dhabi, ST=Abu Dhabi, C=AE"
            test -s android/app/upload-keystore.jks
          else
            echo "Permanent release keystore already available."
          fi

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          echo "SafeNexus HSE release APK generated successfully."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeNexus-HSE-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
