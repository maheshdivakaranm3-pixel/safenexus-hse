plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.safenexus.hse'
    compileSdk 36

    defaultConfig {
        applicationId 'com.safenexus.hse'

        minSdk 24
        targetSdk 36

        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            // Temporary release signing.
            // Replace with a proper release keystore before
            // publishing the app to Google Play.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
